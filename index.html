
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans,'system-ui');font-size:14px;color:var(--color-text-primary,#1a1a1a);background:var(--color-background-tertiary,#f5f5f0)}
.app{padding:16px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:0.5px solid var(--color-border-tertiary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;color:var(--color-text-secondary,#666);font-size:11px;transition:all 0.15s}
.nav-btn i{font-size:20px}
.nav-btn.active{background:#EAF3DE;color:#27500A;border-color:#97C459}
.nav-btn:hover:not(.active){background:var(--color-background-secondary,#f8f8f5)}
.card{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:12px;padding:16px;margin-bottom:12px}
.field-label{font-size:11px;font-weight:500;color:var(--color-text-secondary,#888);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.field{margin-bottom:14px}
input,select,textarea{width:100%;font-family:inherit;font-size:13px;border:0.5px solid var(--color-border-secondary,#ccc);border-radius:8px;padding:7px 10px;background:var(--color-background-primary,#fff);color:var(--color-text-primary,#1a1a1a)}
textarea{resize:vertical;min-height:56px}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;border:1.5px solid var(--color-border-tertiary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;font-size:12px;color:var(--color-text-secondary,#666);transition:all 0.15s;user-select:none;font-family:inherit}
.chip:hover{border-color:#aaa;color:#333}
.chip.sel-green{background:#EAF3DE;border-color:#639922;color:#27500A;font-weight:500}
.chip.sel-blue{background:#E6F1FB;border-color:#378ADD;color:#0C447C;font-weight:500}
.chip.sel-amber{background:#FAEEDA;border-color:#EF9F27;color:#633806;font-weight:500}
.chip.sel-red{background:#FCEBEB;border-color:#E24B4A;color:#791F1F;font-weight:500}
.chip.sel-teal{background:#E1F5EE;border-color:#1D9E75;color:#085041;font-weight:500}
.chip i{font-size:14px}
.btn{cursor:pointer;font-family:inherit;font-size:13px;padding:8px 16px;border-radius:8px;border:0.5px solid var(--color-border-secondary,#ccc);background:transparent;color:var(--color-text-primary,#1a1a1a);transition:background 0.1s}
.btn:hover{background:var(--color-background-secondary,#f5f5f0)}
.btn:active{transform:scale(0.97)}
.btn.primary{background:#27500A;color:#EAF3DE;border-color:#27500A}
.btn.primary:hover{background:#3B6D11}
.btn.sm{font-size:11px;padding:4px 10px}
.btn.danger{color:#A32D2D;border-color:#F09595}
.btn.danger:hover{background:#FCEBEB}
.btn.export{color:#185FA5;border-color:#B5D4F4}
.btn.export:hover{background:#E6F1FB}
.toast{font-size:12px;line-height:32px;min-height:20px}
.toast.ok{color:#3B6D11}
.toast.err{color:#A32D2D}
.entry{border-bottom:0.5px solid var(--color-border-tertiary,#eee);padding:12px 0}
.entry:last-child{border-bottom:none;padding-bottom:0}
.entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 8px;border-radius:20px;margin:2px}
.tag.water{background:#E1F5EE;color:#0F6E56}
.tag.fert{background:#FAEEDA;color:#854F0B}
.tag.repot{background:#EEEDFE;color:#534AB7}
.tag.obs{background:#F1EFE8;color:#5F5E5A}
.tag.alert{background:#FCEBEB;color:#A32D2D}
.tag.good{background:#EAF3DE;color:#3B6D11}
.tag.weather{background:#E6F1FB;color:#185FA5}
.empty{text-align:center;padding:2.5rem 1rem;color:#aaa;font-size:13px}
.empty i{font-size:32px;display:block;margin-bottom:8px;opacity:0.4}
.prompt-output{background:var(--color-background-secondary,#f8f8f5);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:8px;padding:14px;font-size:12px;line-height:1.8;white-space:pre-wrap;margin-top:10px}
.plant-row{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:0.5px solid var(--color-border-tertiary,#eee)}
.plant-row:last-child{border-bottom:none}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filter-btn{padding:5px 12px;border-radius:20px;border:0.5px solid var(--color-border-tertiary,#ddd);background:var(--color-background-primary,#fff);cursor:pointer;font-size:12px;color:var(--color-text-secondary,#888);font-family:inherit}
.filter-btn.active{background:#27500A;color:#EAF3DE;border-color:#27500A}
.search-wrap{position:relative;margin-bottom:12px}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:#aaa;pointer-events:none}
.search-wrap input{padding-left:32px;padding-right:32px}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:15px;padding:2px;display:none}
.search-clear.show{display:block}
.rc{font-size:11px;color:#aaa;margin-bottom:8px}
.sbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--color-text-secondary,#888);padding:8px 12px;background:var(--color-background-secondary,#f5f5f0);border-radius:8px;margin-bottom:12px;border:0.5px solid var(--color-border-tertiary,#eee)}
.sdot{width:7px;height:7px;border-radius:50%;background:#97C459;flex-shrink:0}
.sdot.err{background:#E24B4A}
.sdot.warn{background:#EF9F27}
.export-box{background:var(--color-background-secondary,#f8f8f5);border:0.5px solid var(--color-border-tertiary,#ddd);border-radius:10px;padding:14px;margin-top:12px}
.export-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--color-border-tertiary,#eee)}
.export-row:last-child{border-bottom:none;padding-bottom:0}
.export-label{font-size:13px;font-weight:500}
.export-desc{font-size:11px;color:#888;margin-top:2px}
mark{background:#FAEEDA;color:#633806;border-radius:2px;padding:0 1px}
</style>

<h2 class="sr-only">养花养多肉日志工具</h2>
<div class="app">
  <div class="nav">
    <button class="nav-btn active" onclick="sw('log',this)"><i class="ti ti-pencil" aria-hidden="true"></i>记录</button>
    <button class="nav-btn" onclick="sw('history',this)"><i class="ti ti-clock" aria-hidden="true"></i>历史</button>
    <button class="nav-btn" onclick="sw('prompt',this)"><i class="ti ti-message-2" aria-hidden="true"></i>问AI</button>

    <div class="card">
      <div class="row2">
        <div><div class="field-label">选择植物</div><select id="log-plant"></select></div>

          <button class="chip" data-v="换盆换土" data-cls="sel-teal" onclick="tog(this,'op')"><i class="ti ti-bucket" aria-hidden="true"></i>换盆换土</button>
          <button class="chip" data-v="修剪" data-cls="sel-green" onclick="tog(this,'op')"><i class="ti ti-cut" aria-hidden="true"></i>修剪</button>
          <button class="chip" data-v="淋雨" data-cls="sel-blue" onclick="tog(this,'op')"><i class="ti ti-cloud-rain" aria-hidden="true"></i>淋雨</button>
          <button class="chip" data-v="纯观察" data-cls="sel-teal" onclick="tog(this,'op')"><i class="ti ti-eye" aria-hidden="true"></i>纯观察</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">天气</div>
        <div class="chip-group">
          <button class="chip" data-v="晴天" data-cls="sel-amber" data-single="w" onclick="togS(this)"><i class="ti ti-sun" aria-hidden="true"></i>晴天</button>
          <button class="chip" data-v="阴天" data-cls="sel-teal" data-single="w" onclick="togS(this)"><i class="ti ti-cloud" aria-hidden="true"></i>阴天</button>
          <button class="chip" data-v="下雨" data-cls="sel-blue" data-single="w" onclick="togS(this)"><i class="ti ti-cloud-rain" aria-hidden="true"></i>下雨</button>
          <button class="chip" data-v="高温35°+" data-cls="sel-red" data-single="w" onclick="togS(this)"><i class="ti ti-temperature" aria-hidden="true"></i>高温35°+</button>
          <button class="chip" data-v="梅雨季" data-cls="sel-teal" data-single="w" onclick="togS(this)"><i class="ti ti-droplets" aria-hidden="true"></i>梅雨季</button>

      </div>
      <div class="field">
        <div class="field-label">植物状态观察</div>
        <div class="chip-group">
          <button class="chip" data-v="状态正常" data-cls="sel-green" onclick="tog(this,'st')"><i class="ti ti-check" aria-hidden="true"></i>状态正常</button>
          <button class="chip" data-v="叶片发黄" data-cls="sel-amber" onclick="tog(this,'st')">叶片发黄</button>
          <button class="chip" data-v="叶片发软" data-cls="sel-amber" onclick="tog(this,'st')">叶片发软</button>
          <button class="chip" data-v="焦尖焦边" data-cls="sel-red" onclick="tog(this,'st')">焦尖焦边</button>
          <button class="chip" data-v="掉叶" data-cls="sel-amber" onclick="tog(this,'st')">掉叶</button>
          <button class="chip" data-v="化水腐烂" data-cls="sel-red" onclick="tog(this,'st')">化水腐烂</button>
          <button class="chip" data-v="徒长" data-cls="sel-teal" onclick="tog(this,'st')">徒长</button>
          <button class="chip" data-v="发现虫子" data-cls="sel-red" onclick="tog(this,'st')"><i class="ti ti-bug" aria-hidden="true"></i>发现虫子</button>
          <button class="chip" data-v="开花了" data-cls="sel-green" onclick="tog(this,'st')"><i class="ti ti-heart" aria-hidden="true"></i>开花了</button>
          <button class="chip" data-v="新芽冒出" data-cls="sel-green" onclick="tog(this,'st')"><i class="ti ti-leaf" aria-hidden="true"></i>新芽冒出</button>
        </div>
      </div>
      <div class="field">
        <div class="field-label">备注（肥料品种、用量等）</div>
        <textarea id="log-note" placeholder="例：用花多多1号稀释1000倍浇透"></textarea>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">

      <button class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="清空"><i class="ti ti-x" aria-hidden="true"></i></button>
    </div>
    <div class="filter-row" id="filter-row"><button class="filter-btn active" onclick="setFilter(this,'all')">全部</button></div>
    <div class="rc" id="rc"></div>
    <div class="card" id="history-list"></div>
  </div>

  <div id="tab-prompt" style="display:none">
    <div class="card">
      <div class="row2">
        <div><div class="field-label">选择植物</div><select id="prompt-plant"></select></div>
        <div><div class="field-label">调取最近记录</div>
          <select id="prompt-days">
            <option value="7">最近 7 天</option>
            <option value="14">最近 14 天</option>

        <div class="field-label">当前症状（只填最主要的一种）</div>

        <div><div class="field-label">类型</div>
          <select id="np-type"><option>开花植物</option><option>多肉</option><option>绿植</option><option>其他</option></select>

        <div class="field-label">开始养育时间</div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">

        <div class="export-row">
          <div>
            <div class="export-label">养护日志 CSV</div>

          </label>

<script>
const store = (() => {
  const cs = window.storage;
  let mode = 'unknown';
  async function init() {
    if (cs && typeof cs.set === 'function') {
      try { await cs.set('pj_ping','1'); const r = await cs.get('pj_ping'); if (r&&r.value==='1'){mode='cloud';return 'cloud';} } catch(e) {}
    }
    try { localStorage.setItem('pj_ping','1'); if(localStorage.getItem('pj_ping')==='1'){mode='local';return 'local';} } catch(e) {}
    mode='none'; return 'none';
  }
  async function get(key) {
    if(mode==='cloud'){try{const r=await cs.get(key);return r?r.value:null;}catch(e){return null;}}
    if(mode==='local') return localStorage.getItem(key);
    return null;
  }
  async function set(key,val) {
    if(mode==='cloud'){try{await cs.set(key,val);return true;}catch(e){return false;}}
    if(mode==='local'){try{localStorage.setItem(key,val);return true;}catch(e){return false;}}
    return false;
  }
  return {init,get,set,getMode:()=>mode};
})();

let plants=[],logs=[],selOps=[],selSt=[],selWeather='',curFilter='all',searchKw='';

async function load() {
  const mode = await store.init();
  const dot=document.getElementById('sdot'), stxt=document.getElementById('stext');
  if(mode==='cloud'){dot.className='sdot';stxt.textContent='云端存储 · 数据绑定账号，换设备也能用';}
  else if(mode==='local'){dot.className='sdot warn';stxt.textContent='本地存储 · 数据在此浏览器中，清缓存会丢失';}
  else{dot.className='sdot err';stxt.textContent='存储不可用 · 数据无法保存，建议在 Claude.ai 中使用';}
  try{const v=await store.get('pj_plants');if(v)plants=JSON.parse(v);}catch(e){plants=[];}
  try{const v=await store.get('pj_logs');if(v)logs=JSON.parse(v);}catch(e){logs=[];}
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('log-date').value=today;
  document.getElementById('np-date').value=today;
  refreshSelects();renderPlants();renderHistory();
}

async function persist() {
  const ok1=await store.set('pj_plants',JSON.stringify(plants));
  const ok2=await store.set('pj_logs',JSON.stringify(logs));
  return ok1&&ok2;
}

function refreshSelects() {
  const o=plants.length?plants.map(p=>`<option value="${p.id}">${p.name}</option>`).join(''):'<option value="">先去「我的花」添加植物</option>';
  document.getElementById('log-plant').innerHTML=o;
  document.getElementById('prompt-plant').innerHTML=o;
  const extra=plants.map(p=>`<button class="filter-btn" onclick="setFilter(this,'${p.id}')">${p.name}</button>`).join('');
  document.getElementById('filter-row').innerHTML=`<button class="filter-btn${curFilter==='all'?' active':''}" onclick="setFilter(this,'all')">全部</button>${extra}`;
}

function tog(btn,type){
  const v=btn.dataset.v,cls=btn.dataset.cls,arr=type==='op'?selOps:selSt,i=arr.indexOf(v);
  if(i>-1){arr.splice(i,1);btn.className='chip';}else{arr.push(v);btn.className='chip '+cls;}
}
function togS(btn){
  document.querySelectorAll('[data-single="w"]').forEach(b=>b.className='chip');
  if(selWeather===btn.dataset.v){selWeather='';}else{selWeather=btn.dataset.v;btn.className='chip '+btn.dataset.cls;}
}

async function saveLog(){
  const pid=document.getElementById('log-plant').value;
  if(!pid||!plants.find(p=>p.id===pid)){toast('save-msg','请先在「我的花」添加植物',false);return;}
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='保存中…';
  logs.unshift({id:Date.now().toString(),plantId:pid,date:document.getElementById('log-date').value,ops:[...selOps],weather:selWeather,statuses:[...selSt],note:document.getElementById('log-note').value.trim()});
  const ok=await persist();
  btn.disabled=false;btn.innerHTML='<i class="ti ti-check" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>保存记录';
  if(ok){clearForm();toast('save-msg','记录已保存 ✓',true);renderHistory();}
  else{logs.shift();toast('save-msg','保存失败，请重试',false);}
}

function clearForm(){
  selOps=[];selSt=[];selWeather='';
  document.querySelectorAll('.chip').forEach(b=>b.className='chip');
  document.getElementById('log-note').value='';
}

async function deleteLog(id){logs=logs.filter(l=>l.id!==id);await persist();renderHistory();}

function setFilter(btn,f){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');curFilter=f;renderHistory();
}
function onSearch(v){searchKw=v.trim();document.getElementById('search-clear').classList.toggle('show',searchKw.length>0);renderHistory();}
function clearSearch(){document.getElementById('search-input').value='';searchKw='';document.getElementById('search-clear').classList.remove('show');renderHistory();}

function hl(t,kw){
  if(!kw)return t;
  return t.replace(new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);
}

function renderHistory(){
  const el=document.getElementById('history-list'),rc=document.getElementById('rc');
  let list=curFilter==='all'?[...logs]:logs.filter(l=>l.plantId===curFilter);
  if(searchKw)list=list.filter(l=>{
    const p=plants.find(x=>x.id===l.plantId);
    return [p?p.name:'',l.ops.join(' '),l.statuses.join(' '),l.weather||'',l.note||'',l.date].join(' ').toLowerCase().includes(searchKw.toLowerCase());
  });
  rc.textContent=(searchKw||curFilter!=='all')?`找到 ${list.length} 条记录`:'';
  if(!list.length){el.innerHTML=`<div class="empty"><i class="ti ti-notes" aria-hidden="true"></i>${searchKw?'没有匹配的记录':'还没有记录'}</div>`;return;}
  el.innerHTML=list.map(l=>{
    const p=plants.find(x=>x.id===l.plantId),pname=p?p.name:'未知';
    const hasAlert=l.statuses.some(s=>['叶片发黄','叶片发软','焦尖焦边','掉叶','化水腐烂','发现虫子'].includes(s));
    const opTags=l.ops.map(o=>`<span class="tag ${o==='浇水'||o==='淋雨'?'water':o==='施肥'?'fert':o==='换盆换土'?'repot':'obs'}">${hl(o,searchKw)}</span>`).join('');
    const stTags=l.statuses.map(s=>`<span class="tag ${['状态正常','开花了','新芽冒出'].includes(s)?'good':['叶片发黄','叶片发软','焦尖焦边','掉叶','化水腐烂','发现虫子'].includes(s)?'alert':'obs'}">${hl(s,searchKw)}</span>`).join('');
    const wTag=l.weather?`<span class="tag weather">${hl(l.weather,searchKw)}</span>`:'';
    return `<div class="entry">
      <div class="entry-head">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:7px;height:7px;border-radius:50%;background:${hasAlert?'#E24B4A':'#639922'}"></div>
          <span style="font-size:13px;font-weight:500">${hl(pname,searchKw)}</span>
          <span style="font-size:11px;color:#aaa">${l.date}</span>
        </div>
        <button class="btn sm danger" onclick="deleteLog('${l.id}')">删除</button>
      </div>
      <div style="margin-bottom:4px">${opTags}${wTag}</div>
      ${stTags?`<div style="margin-bottom:4px">${stTags}</div>`:''}
      ${l.note?`<div style="font-size:12px;color:#888;padding-left:15px">${hl(l.note,searchKw)}</div>`:''}
    </div>`;
  }).join('');
}

async function addPlant(){
  const name=document.getElementById('np-name').value.trim();
  if(!name){toast('plant-msg','请填写植物名称',false);return;}
  plants.push({id:Date.now().toString(),name,type:document.getElementById('np-type').value,soil:document.getElementById('np-soil').value.trim(),pot:document.getElementById('np-pot').value.trim(),since:document.getElementById('np-date').value});
  const ok=await persist();
  if(ok){document.getElementById('np-name').value='';document.getElementById('np-soil').value='';document.getElementById('np-pot').value='';toast('plant-msg','已添加 '+name+' ✓',true);refreshSelects();renderPlants();}
  else{plants.pop();toast('plant-msg','保存失败，请重试',false);}
}

async function delPlant(id){plants=plants.filter(p=>p.id!==id);logs=logs.filter(l=>l.plantId!==id);await persist();refreshSelects();renderPlants();renderHistory();}

function renderPlants(){
  const el=document.getElementById('plants-list');
  if(!plants.length){el.innerHTML='<div class="empty"><i class="ti ti-plant-2" aria-hidden="true"></i>还没有植物，在上方添加第一棵</div>';return;}
  el.innerHTML=plants.map(p=>`<div class="plant-row">
    <div style="display:flex;gap:10px">
      <div style="width:8px;height:8px;border-radius:50%;background:#639922;margin-top:5px;flex-shrink:0"></div>
      <div>
        <div style="font-weight:500;font-size:14px">${p.name}<span style="font-size:11px;color:#888;margin-left:6px;font-weight:400">${p.type}</span></div>
        ${p.since?`<div style="font-size:11px;color:#888">养育自 ${p.since}</div>`:''}
        ${p.soil?`<div style="font-size:11px;color:#888">土：${p.soil}${p.pot?' · 盆：'+p.pot:''}</div>`:''}
      </div>
    </div>
    <button class="btn sm danger" onclick="delPlant('${p.id}')">删除</button>
  </div>`).join('');
}

// 导出 CSV
function exportCSV(){
  if(!logs.length){toast('export-msg','还没有记录，先添加一些再导出',false);return;}
  const rows=[['日期','植物名称','植物类型','操作','天气','状态观察','备注']];
  logs.forEach(l=>{
    const p=plants.find(x=>x.id===l.plantId);
    rows.push([
      l.date,
      p?p.name:'未知',
      p?p.type:'',
      l.ops.join('、'),
      l.weather||'',
      l.statuses.join('、'),
      l.note||''
    ]);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  download('养护日志_'+today()+'.csv', csv, 'text/csv;charset=utf-8');
  toast('export-msg','CSV 已下载，用 Excel 打开即可 ✓',true);
}

// 导出 JSON
function exportJSON(){
  if(!plants.length&&!logs.length){toast('export-msg','还没有任何数据',false);return;}
  const data=JSON.stringify({version:1,exported:new Date().toISOString(),plants,logs},null,2);
  download('养花日志备份_'+today()+'.json', data, 'application/json');
  toast('export-msg','备份已下载，可用于恢复数据 ✓',true);
}

// 导入 JSON
function importJSON(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.plants||!data.logs)throw new Error('格式不对');
      plants=data.plants;logs=data.logs;
      const ok=await persist();
      if(ok){refreshSelects();renderPlants();renderHistory();toast('export-msg',`已恢复 ${plants.length} 株植物、${logs.length} 条记录 ✓`,true);}
      else toast('export-msg','恢复失败，存储写入出错',false);
    }catch(err){
      toast('export-msg','文件格式有误，请选择正确的备份文件',false);
    }
    input.value='';
  };
  reader.readAsText(file);
}

function download(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function today(){return new Date().toISOString().slice(0,10).replace(/-/g,'');}

function genPrompt(){
  const pid=document.getElementById('prompt-plant').value,p=plants.find(x=>x.id===pid);
  if(!p){alert('请先添加植物');return;}
  const symptom=document.getElementById('prompt-symptom').value.trim();
  if(!symptom){alert('请填写当前症状');return;}
  const days=parseInt(document.getElementById('prompt-days').value);
  const cutoff=new Date(Date.now()-days*86400000).toISOString().slice(0,10);
  const recent=logs.filter(l=>l.plantId===pid&&l.date>=cutoff).sort((a,b)=>a.date>b.date?1:-1);
  const opsLog=recent.length?'\n\n最近养护记录：\n'+recent.map(l=>{
    const parts=[];
    if(l.ops.length)parts.push(l.ops.join('、'));
    if(l.weather)parts.push('天气：'+l.weather);
    if(l.statuses.length)parts.push('状态：'+l.statuses.join('、'));
    if(l.note)parts.push(l.note);
    return `${l.date}  ${parts.join(' | ')}`;
  }).join('\n'):'\n\n近期暂无养护操作记录。';
  const txt=`我是养花纯新手，在浙江室外南阳台养【${p.name}】（${p.type}${p.since?'，养育自'+p.since:''}）。\n土：${p.soil||'未记录'}，盆：${p.pot||'未记录'}，阳台通风好。\n\n当前症状：${symptom}${opsLog}\n\n请严格按顺序排查：浇水淋雨 → 光照 → 盆土透气 → 虫害病菌 → 温度温差 → 施肥\n全程大白话，不要专业术语，输出：\n① 最可能的1-2个核心原因\n② 现在立刻要做的事（分步骤）\n③ 以后如何预防复发`;
  document.getElementById('prompt-text').textContent=txt;
  document.getElementById('prompt-out').style.display='block';
}

function copyPrompt(){navigator.clipboard.writeText(document.getElementById('prompt-text').textContent).then(()=>toast('copy-msg','已复制 ✓',true));}

function sw(name,btn){
  ['log','history','prompt','plants'].forEach(t=>document.getElementById('tab-'+t).style.display=t===name?'block':'none');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(name==='history')renderHistory();
}

const toastTimers={};
function toast(id,txt,ok){
  const el=document.getElementById(id);el.textContent=txt;el.className='toast '+(ok?'ok':'err');
  clearTimeout(toastTimers[id]);toastTimers[id]=setTimeout(()=>el.textContent='',3000);
}

load();
</script>
